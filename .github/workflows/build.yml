name: Test and build Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install aiohttp pytest pytest-asyncio ruff
      - run: ruff check . && python -m compileall -q main.py bridge && python -m pytest -q
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/android-connect.jks"
      - name: Build signed release and run lint
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-connect.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease lintRelease assembleDebug assembleDebugAndroidTest
      - name: Build pull request
        if: github.event_name == 'pull_request'
        working-directory: android
        run: gradle --no-daemon assembleDebug lintDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            android/app/build/outputs/apk/
            android/app/build/reports/lint-results-*.html
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: build-output
      - name: Package release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-files
          cp build-output/apk/release/app-release.apk release-files/AstrBot-Android-Connect-${GITHUB_REF_NAME}.apk
          git archive --format=zip --prefix=astrbot_plugin_Android_connect/ HEAD -o release-files/astrbot_plugin_Android_connect-${GITHUB_REF_NAME}.zip
          cd release-files
          sha256sum *.apk *.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --title "Android Connect $GITHUB_REF_NAME" --notes-file ../docs/RELEASE_NOTES.md --prerelease ./*
